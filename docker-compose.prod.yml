services:
  db:
    image: postgres:16-alpine
    container_name: smecrm-db
    restart: always
    environment:
      - POSTGRES_DB=${DBNAME:-crm_db}
      - POSTGRES_USER=${DBUSER:-postgres}
      - POSTGRES_PASSWORD=${DBPASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sql:/docker-entrypoint-initdb.d/init-rls-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smecrm-network

  redis:
    image: redis:7-alpine
    container_name: smecrm-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smecrm-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smecrm-api
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY:-django_secure_sme_crm_pro_secret_key_2025_vietnam}
      - ENV_TYPE=dev
      - ALLOW_LOOPBACK_FRONTEND_URL=True
      - DEBUG=False
      - DOMAIN_NAME=${DOMAIN_NAME:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DBNAME=${DBNAME:-crm_db}
      - DBUSER=${DBUSER:-postgres}
      - DBPASSWORD=${DBPASSWORD:-postgres123}
      - DBHOST=db
      - DBPORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3000},http://localhost:3000,http://127.0.0.1:3000
      - CSRF_TRUSTED_ORIGINS=${FRONTEND_URL:-http://localhost:3000},http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh
    volumes:
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - smecrm-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smecrm-celery-worker
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY:-django_secure_sme_crm_pro_secret_key_2025_vietnam}
      - ENV_TYPE=production
      - DEBUG=False
      - DBNAME=${DBNAME:-crm_db}
      - DBUSER=${DBUSER:-postgres}
      - DBPASSWORD=${DBPASSWORD:-postgres123}
      - DBHOST=db
      - DBPORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A crm worker --loglevel=info
    networks:
      - smecrm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: smecrm-web
    restart: always
    environment:
      - PUBLIC_DJANGO_API_URL=${PUBLIC_DJANGO_API_URL:-http://localhost:8000}
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - PORT=3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - smecrm-network

volumes:
  postgres_data:
    name: smecrm_postgres_data

networks:
  smecrm-network:
    name: smecrm_network
    driver: bridge